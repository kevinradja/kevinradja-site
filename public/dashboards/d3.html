(function(SPEC){(async function(){
var FR=true;try{FR=!/^\/en(\/|$)/.test(top.location.pathname)}catch(e){}try{var q=new URLSearchParams(location.search).get('lang');if(q)FR=q!=='en'}catch(e){}
const loc=FR?'fr-FR':'en-GB',T=x=>Array.isArray(x)?x[FR?1:0]:x;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const CFG=SPEC.gen?SPEC.gen():JSON.parse(await inf(document.getElementById('d').textContent.trim())),TB={};
Object.keys(CFG.tables).forEach(k=>{const t=CFG.tables[k];TB[k]=t.rows.map(r=>{const o={};t.cols.forEach((c,i)=>o[c]=r[i]);return o})});
const F=(v,f)=>{if(v==null||!isFinite(v))return '–';const a=Math.abs(v),L=(x,d)=>x.toLocaleString(loc,{maximumFractionDigits:d});
if(f=='eur')return a>=1e6?L(v/1e6,2)+' M€':a>=1e4?L(v/1e3,a>=1e5?0:1)+' k€':L(Math.round(v),0)+' €';
if(f=='pct')return L(v*100,a<.1?1:0)+' %';if(f=='x')return L(v,2)+'×';if(f=='h')return L(Math.round(v),0)+' h';if(f=='d')return Math.round(v)+(FR?' j':' d');
return a>=1e6?L(v/1e6,1)+' M':a>=1e4?L(v/1e3,0)+' k':L(v,a<10&&v%1?1:0)};
const ML=k=>/^\d{4}-\d\d$/.test(k)?new Date(k+'-15').toLocaleDateString(loc,{month:'short'}).replace('.','')+' '+k.slice(2,4):String(k);
const H={sum:(r,c)=>r.reduce((s,x)=>s+(+x[c]||0),0),
grp:(r,c)=>{const m=new Map();r.forEach(x=>{const k=x[c];m.has(k)||m.set(k,[]);m.get(k).push(x)});return m},
by:(r,c,f)=>[...H.grp(r,c)].map(e=>[e[0],f(e[1])]),
mo:(r,c,f)=>H.by(r,c,f).filter(e=>/^\d{4}-\d\d$/.test(e[0])).sort((a,b)=>a[0]<b[0]?-1:1),
top:(a,n)=>a.slice().sort((x,y)=>y[1]-x[1]).slice(0,n||99),
uniq:(r,c)=>[...new Set(r.map(x=>x[c]))],F,ML,T,FR,TB};
const P=SPEC.pal,C=i=>P[i%P.length],tip=s=>' data-t="'+esc(s)+'"';
const spark=a=>{if(!a||a.length<2)return '';const mx=Math.max(...a),mn=Math.min(...a),w=90,h=26,p=a.map((v,i)=>(i*w/(a.length-1)).toFixed(1)+','+(h-3-(v-mn)/((mx-mn)||1)*(h-6)).toFixed(1)).join(' ');return `<svg class="sk" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polygon points="0,${h} ${p} ${w},${h}" fill="var(--a)" opacity=".16"/><polyline points="${p}" fill="none" stroke="var(--a)" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`};
const chip=(d,inv)=>d==null||!isFinite(d)?'':`<span class="ch ${(d>=0)!=!!inv?'ok':'ko'}">${d>=0?'▲':'▼'} ${F(Math.abs(d),'pct')}</span>`;
const sub=o=>o.sub?`<em>${esc(T(o.sub))}</em>`:'';
const K={
