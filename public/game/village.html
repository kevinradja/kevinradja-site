<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Le Village des Données</title>
<style>
:root{--bg:#F7F7F5;--card:#fff;--ink:#0E1116;--mute:#6B7480;--line:#E3E6E8;--acc:#1AA7B0;--gold:#E0A030}
:root[data-theme="dark"]{--bg:#0E1116;--card:#171B21;--ink:#F3F5F7;--mute:#9AA3AE;--line:#262C34;--acc:#3FD3DC}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1116;--card:#171B21;--ink:#F3F5F7;--mute:#9AA3AE;--line:#262C34;--acc:#3FD3DC}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;justify-content:center;padding:8px 12px 16px}
.wrap{width:100%;max-width:440px}
.top{display:flex;align-items:center;gap:10px;margin-bottom:8px;font-size:13px;color:var(--mute)}
.top b{color:var(--ink)}
.xp{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--acc),#8EEAF0);transition:width .5s}
.top button,.pad button{all:unset;cursor:pointer;-webkit-tap-highlight-color:transparent}
.top button{border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:12px;color:var(--ink)}
.stage{position:relative;aspect-ratio:4/5;background:#7EC850;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 18px 50px rgba(14,17,22,.12);touch-action:none;user-select:none;-webkit-user-select:none}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges}
.dlg{position:absolute;left:10px;right:10px;bottom:10px;background:rgba(255,253,246,.97);color:#1d2430;border:3px solid #2A2F36;border-radius:12px;padding:12px 14px 14px;font-size:14.5px;line-height:1.45;min-height:92px;box-shadow:0 6px 0 rgba(0,0,0,.18);cursor:pointer}
.dlg .who{position:absolute;top:-14px;left:12px;background:#2A2F36;color:#fff;font-size:12px;font-weight:800;padding:3px 10px;border-radius:8px;letter-spacing:.02em}
.dlg.mem{background:rgba(232,250,251,.97);border-color:#1AA7B0}
.dlg.mem .who{background:#1AA7B0}
.dlg.mem .tx{font-style:italic}
.dlg.nar .who{background:#8A5CC2}
.dlg .nx{position:absolute;right:10px;bottom:6px;font-size:11px;color:#6B7480;animation:bob .8s infinite alternate}
@keyframes bob{to{transform:translateY(-3px)}}
.toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#2A2F36;color:#fff;font-weight:700;font-size:13px;padding:8px 14px;border-radius:999px;white-space:nowrap;box-shadow:0 6px 18px rgba(0,0,0,.25);animation:tin .3s ease-out}
@keyframes tin{from{opacity:0;transform:translate(-50%,-8px)}}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:26px;background:color-mix(in srgb,var(--card) 86%,transparent);backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px)}
.ov h2{font-size:25px;letter-spacing:-.02em;margin-bottom:10px}
.ov p{color:var(--mute);font-size:14px;line-height:1.5;max-width:320px}
.ov .em{font-size:40px;margin-bottom:8px}
.ov .st{display:flex;gap:18px;margin:14px 0 2px;font-size:13px;color:var(--mute)}
.ov .st b{display:block;font-size:22px;color:var(--ink)}
.go{margin-top:18px;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:12px 24px;font-weight:700;font-size:14px;cursor:pointer}
.hint{margin-top:12px;font-size:12px;color:var(--mute);max-width:300px;line-height:1.5}
.dash{position:absolute;left:18px;right:18px;top:18%;background:#fffdf6;color:#1d2430;border:3px solid #2A2F36;border-radius:14px;padding:14px 16px;box-shadow:0 8px 0 rgba(0,0,0,.18)}
.dash h3{font-size:14px;margin-bottom:10px}
.dash .r{font-size:12.5px;margin:8px 0 4px;display:flex;justify-content:space-between}
.dash .b{height:12px;border-radius:4px;background:#E3E6E8;overflow:hidden}
.dash .b i{display:block;height:100%;width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.hide{display:none!important}
html.embed #snd,html.embed #theme{display:none}
.inv{display:flex;gap:6px;justify-content:center;margin-top:10px}
.inv span{width:38px;height:38px;border-radius:10px;border:1px dashed var(--line);display:grid;place-items:center;font-size:20px;filter:grayscale(1);opacity:.35;transition:.3s}
.inv span.on{border-style:solid;border-color:var(--acc);filter:none;opacity:1;transform:scale(1.04)}
.obj{text-align:center;font-size:12.5px;color:var(--mute);margin-top:8px;min-height:18px}
.pad{display:flex;justify-content:space-between;align-items:center;margin-top:10px}
.dp{display:grid;grid-template-columns:repeat(3,44px);grid-template-rows:repeat(3,44px);gap:3px}
.pad button{background:var(--card);border:1px solid var(--line);border-radius:10px;display:grid;place-items:center;font-size:16px;color:var(--ink);touch-action:none}
.pad button:active,.pad button.dn{background:var(--line)}
.dp .u{grid-column:2;grid-row:1}.dp .l{grid-column:1;grid-row:2}.dp .r{grid-column:3;grid-row:2}.dp .d{grid-column:2;grid-row:3}
.pad .ab{width:68px;height:68px;border-radius:50%!important;font-weight:800;font-size:15px!important;background:var(--acc)!important;color:#fff!important;border:0!important}
.kb{font-size:11.5px;color:var(--mute);text-align:center;flex:1;padding:0 8px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span><b id="lv">Niv. 1</b></span><div class="xp"><i id="xpb"></i></div><span id="xpt">0 XP</span><button id="snd" aria-label="sound">🔊</button><button id="theme" aria-label="theme">◐</button></div>
  <div class="stage" id="stage">
    <canvas id="c" width="256" height="320"></canvas>
    <div class="dlg hide" id="dlg"><span class="who" id="who"></span><div class="tx" id="tx"></div><span class="nx">▼</span></div>
    <div class="dash hide" id="dash"></div>
    <div id="toasts"></div>
    <div class="ov" id="start">
      <div class="em">🏡</div>
      <h2 data-t="title"></h2>
      <p data-t="intro"></p>
      <button class="go" id="play" data-t="play"></button>
      <p class="hint" data-t="keys"></p>
    </div>
    <div class="ov hide" id="end"></div>
  </div>
  <div class="inv" id="inv"></div>
  <div class="obj" id="obj"></div>
  <div class="pad">
    <div class="dp">
      <button class="u" data-d="up" aria-label="up">▲</button><button class="l" data-d="left" aria-label="left">◀</button><button class="r" data-d="right" aria-label="right">▶</button><button class="d" data-d="down" aria-label="down">▼</button>
    </div>
    <div class="kb" data-t="kb"></div>
    <button class="ab" id="act" aria-label="action">A</button>
  </div>
</div>
<script>
(function(){
'use strict';
/* ---------- language, theme, sound ---------- */
var L=(new URLSearchParams(location.search).get('lang')||'fr').slice(0,2)==='en'?'en':'fr';
document.documentElement.lang=L;
var root=document.documentElement;
if(parent!==window)root.classList.add('embed');
try{var th=localStorage.getItem('kr-theme');if(th)root.setAttribute('data-theme',th)}catch(e){}
try{var pt=parent!==window&&parent.document.documentElement.getAttribute('data-theme');if(pt)root.setAttribute('data-theme',pt)}catch(e){}
function isDark(){var t=root.getAttribute('data-theme');return t?t==='dark':matchMedia('(prefers-color-scheme:dark)').matches}
var muted=false;try{muted=localStorage.getItem('kr-sound')==='off'}catch(e){}
window.addEventListener('message',function(e){var d=e.data||{};if(d.krTheme)root.setAttribute('data-theme',d.krTheme);if(d.krSound){muted=d.krSound==='off';applyMute();paintSnd()}});
document.getElementById('theme').onclick=function(){var n=isDark()?'light':'dark';root.setAttribute('data-theme',n);try{localStorage.setItem('kr-theme',n)}catch(e){}};
var sb=document.getElementById('snd');function paintSnd(){sb.textContent=muted?'🔇':'🔊'}paintSnd();
sb.onclick=function(){muted=!muted;try{localStorage.setItem('kr-sound',muted?'off':'on')}catch(e){}applyMute();paintSnd()};
function post(){try{parent.postMessage({krHeight:document.body.getBoundingClientRect().height+4},'*')}catch(e){}}
if(window.ResizeObserver)new ResizeObserver(post).observe(document.body);addEventListener('load',post);

var TX={
 fr:{title:'Le Village des Données',intro:'Le village ne sait plus où passent son eau, ses loyers et ses dépenses. Parle aux six habitants marqués d’un « ! », gagne de l’expérience et récupère leurs objets. Puis va voir la maire, au nord.',play:'Jouer',keys:'Flèches, ZQSD ou WASD pour marcher · Espace ou Entrée pour parler',kb:'Approche-toi d’un habitant puis appuie sur A, ou sur la barre Espace au clavier',lv:'Niv.',obj:function(n){return 'Parle aux habitants marqués d’un « ! » ('+n+'/6)'},objMayor:'Tout est réuni ! Va voir la maire, devant la mairie au nord.',objDone:'Le village est en fête 🎉',got:'obtenu',lvup:'Niveau ',endT:'Fête au village !',endP:'Chaque habitant représentait une étape du parcours de Kevin : KPMG, Dassault Systèmes, Google, Coface, son poste actuel… et le karaté.',again:'Rejouer',stLv:'niveau',stSteps:'pas',stTime:'temps',best:'record',dashT:'📊 Tableau de bord du village',d1:'Eau économisée',d2:'Loyers payés à l’heure',d3:'Dépenses classées',mem:'Souvenir',now:'Aujourd’hui',beyond:'En dehors des données',narr:'Récit'},
 en:{title:'Data Village',intro:'The village no longer knows where its water, rents and spending go. Talk to the six villagers marked with “!”, gain experience and collect their items. Then visit the mayor, up north.',play:'Play',keys:'Arrows or WASD to walk · Space or Enter to talk',kb:'Walk up to a villager, then press A, or the Space bar on a keyboard',lv:'Lvl',obj:function(n){return 'Talk to the villagers marked with “!” ('+n+'/6)'},objMayor:'You have everything! Visit the mayor, outside the town hall up north.',objDone:'The village is celebrating 🎉',got:'collected',lvup:'Level ',endT:'Village festival!',endP:'Each villager stood for a step of Kevin’s journey: KPMG, Dassault Systèmes, Google, Coface, his current role… and karate.',again:'Play again',stLv:'level',stSteps:'steps',stTime:'time',best:'best',dashT:'📊 Village dashboard',d1:'Water saved',d2:'Rents paid on time',d3:'Spending categorised',mem:'Memory',now:'Today',beyond:'Beyond data',narr:'Story'}
}[L];
document.querySelectorAll('[data-t]').forEach(function(e){e.textContent=TX[e.dataset.t]});

/* ---------- audio: gentle 8-bit loop + small effects ---------- */
var AC=null,master=null,nextT=0,stepI=0,timer=null,mode='loop',fanI=0;
function applyMute(){if(master&&AC)master.gain.setTargetAtTime(muted?0:.55,AC.currentTime,.05)}
function hz(m){return 440*Math.pow(2,(m-69)/12)}
function note(m,t,d,type,v){if(!AC||!m)return;var o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(hz(m),t);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.03)}
// C major, gentle: lead (8ths) and bass (quarters). 0 = rest.
var LEAD=[76,0,79,0,81,79,76,0, 72,0,76,0,74,72,69,0, 69,72,74,0,72,69,67,0, 67,69,72,0,74,0,76,0,
          76,0,79,0,84,0,81,79, 76,0,74,72,0,69,72,0, 74,0,72,69,67,0,69,0, 72,0,0,0,0,0,0,0];
var BASS=[48,55,48,55, 45,52,45,52, 41,48,41,48, 43,50,43,50, 48,55,48,55, 45,52,45,52, 41,48,43,50, 48,43,48,0];
var FAN=[72,76,79,84,0,79,84,0,81,84,88,0,86,84,88,91];
var BPM=92,E=60/BPM/2;
function tick(){while(nextT<AC.currentTime+.15){
  if(mode==='fan'){var m=FAN[fanI];note(m,nextT,.22,'square',.05);note(m-12,nextT,.22,'triangle',.08);fanI++;if(fanI>=FAN.length){mode='loop';stepI=0}}
  else{note(LEAD[stepI],nextT,E*1.6,'square',.035);if(stepI%2===0)note(BASS[stepI/2|0],nextT,E*1.8,'triangle',.09);stepI=(stepI+1)%LEAD.length}
  nextT+=E}}
function startAudio(){try{if(!AC){var A=window.AudioContext||window.webkitAudioContext;if(!A)return;AC=new A();master=AC.createGain();var lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2400;master.connect(lp);lp.connect(AC.destination);applyMute()}
  if(AC.state==='suspended')AC.resume();if(!timer){nextT=AC.currentTime+.1;timer=setInterval(tick,30)}}catch(e){}}
function fx(name){if(!AC||muted)return;var t=AC.currentTime;
  if(name==='blip')note(88,t,.03,'square',.02);
  if(name==='talk')note(79,t,.06,'triangle',.06);
  if(name==='item'){[72,76,79,84].forEach(function(m,i){note(m,t+i*.07,.14,'square',.05)})}
  if(name==='level'){[67,72,76,79,84].forEach(function(m,i){note(m,t+i*.06,.16,'triangle',.09)})}
  if(name==='bump')note(45,t,.05,'triangle',.05)}

/* ---------- world ---------- */
var T=16,MW=32,MH=26,VW=16,VH=20;
var M=[],i,x,y;
for(y=0;y<MH;y++){M.push([]);for(x=0;x<MW;x++)M[y].push((x===0||y===0||x===MW-1||y===MH-1)?'t':'g')}
function set(x,y,c){if(M[y]&&M[y][x]!==undefined)M[y][x]=c}
function hash(x,y){var h=x*374761393+y*668265263;h=(h^(h>>13))*1274126177;return (h^(h>>16))>>>0}
for(y=0;y<MH;y++)for(x=0;x<MW;x++){var dx=(x-5.5)/4,dy=(y-20.5)/2.6;if(dx*dx+dy*dy<1)set(x,y,'w')}
for(x=1;x<MW-1;x++){set(x,13,'p');set(x,14,'p')}
for(y=6;y<MH-1;y++){set(15,y,'p');set(16,y,'p')}
for(y=7;y<13;y++){set(5,y,'p');set(24,y,'p')}
for(x=11;x<15;x++)set(x,10,'p');
for(y=15;y<21;y++)set(23,y,'p');for(x=24;x<28;x++)set(x,20,'p');
for(x=17;x<20;x++)set(x,21,'p');
for(x=10;x<15;x++)set(x,19,'p');
var B=[
 {id:'hall',x:12,y:1,w:8,h:5,roof:'#4A74C9',wall:'#F4E7CF',door:[15,16],sign:L==='fr'?'MAIRIE':'TOWN HALL'},
 {id:'rent',x:3,y:3,w:5,h:4,roof:'#C8553D',wall:'#F2E2C4',door:[5],icon:'🔑'},
 {id:'bake',x:22,y:3,w:5,h:4,roof:'#E0A030',wall:'#F6EAD2',door:[24],icon:'🥖'},
 {id:'forge',x:25,y:16,w:5,h:4,roof:'#6B6F78',wall:'#D9D4CC',door:[27],icon:'⚒️',chimney:true},
 {id:'lib',x:18,y:17,w:4,h:4,roof:'#8A5CC2',wall:'#F1E6F7',door:[19],icon:'📚'}
];
B.forEach(function(b){for(var yy=b.y;yy<b.y+b.h;yy++)for(var xx=b.x;xx<b.x+b.w;xx++)set(xx,yy,'b')});
[[9,9],[10,9],[9,10],[10,10]].forEach(function(p){set(p[0],p[1],'W')});
[[2,9],[8,4],[10,2],[21,9],[28,6],[29,11],[27,23],[21,24],[12,23],[2,16],[9,15],[19,8],[11,16],[29,16],[7,10],[26,1],[3,24],[13,8],[20,11],[29,2],[1,12],[18,23],[24,24],[30,19],[6,17],[22,15]].forEach(function(p){if(M[p[1]][p[0]]==='g')set(p[0],p[1],'t')});
for(y=1;y<MH-1;y++)for(x=1;x<MW-1;x++)if(M[y][x]==='g'&&hash(x,y)%9===0)M[y][x]='f';

/* ---------- characters ---------- */
var NPC=[
 {id:'ines',x:20,y:21,dir:'left',name:'Inès',role:L==='fr'?'bibliothécaire':'librarian',P:{skin:'#E9B98F',hair:'#3B2A4A',top:'#8A5CC2',bot:'#3A3550',glasses:1},item:['🗺️',L==='fr'?'Carte des sources':'Map of sources'],
  fr:[["npc", "Bonjour ! Les registres du village sont éparpillés dans trois greniers. Chacun donne un chiffre différent, et plus personne ne sait lequel croire."], ["mem", "Ça me rappelle 2022, chez KPMG : des centaines de pages éparpillées, qu’on a regroupées dans une seule chaîne de publication. Près de 300 articles migrés, rien de perdu. Ici, on fait pareil : tout au même endroit, avec la source de chaque chiffre."], ["npc", "Un seul registre, et pour chaque chiffre, d’où il vient… Voilà qui règle nos disputes ! Prends cette carte des sources, tu en auras besoin."]],
  en:[["npc", "Hello! The village records are scattered across three attics. Each one gives a different number, and nobody knows which to trust."], ["mem", "That reminds me of 2022 at KPMG: hundreds of scattered pages, brought together into one publishing pipeline. Nearly 300 articles migrated, nothing lost. Same here: everything in one place, with the source of every number."], ["npc", "One register, and for every number, where it comes from… That settles our arguments! Take this map of sources, you’ll need it."]]},
 {id:'gaspard',x:28,y:20,dir:'left',name:'Gaspard',role:L==='fr'?'forgeron':'blacksmith',P:{skin:'#C98E66',hair:'#2B1B12',top:'#7A4A2A',bot:'#3A3A3A',apron:1,beard:1},item:['🔧',L==='fr'?'Clé d’automatisation':'Automation wrench'],
  fr:[["npc", "Chaque mois, je recopie à la main les comptes de toute la forge. Cent heures de travail ! Mes bras n’en peuvent plus."], ["mem", "En 2023, chez Dassault Systèmes, on avait le même genre de corvée : des traitements de données qui prenaient 100 heures. Avec des scripts automatisés, c’est tombé à 3 heures. Ce qui revient chaque mois, une machine peut le faire à ta place."], ["npc", "Une machine qui recopie pour moi ? Ha ! Prends cette clé d’automatisation. Je vais enfin pouvoir forger autre chose que des tableaux."]],
  en:[["npc", "Every month I copy the whole forge’s accounts by hand. A hundred hours of work! My arms can’t take it anymore."], ["mem", "In 2023 at Dassault Systèmes we had the same kind of chore: data processing that took 100 hours. With automated scripts it dropped to 3 hours. What comes back every month, a machine can do for you."], ["npc", "A machine that copies for me? Ha! Take this automation wrench. I can finally forge something other than spreadsheets."]]},
 {id:'lina',x:12,y:9,dir:'down',name:'Lina',role:L==='fr'?'fontainière':'well keeper',P:{skin:'#F0C7A0',hair:'#C0662B',top:'#3D8FD1',bot:'#2E4A6B',hat:'#3D8FD1'},item:['💧',L==='fr'?'Compteur d’eau':'Water meter'],
  fr:[["npc", "Le puits se vide plus vite chaque été… mais personne ne sait combien d’eau le village consomme, ni à quel moment."], ["mem", "En 2024, chez Google France, j’ai construit un tableau de mesure pour 180 grands comptes. La leçon : on ne peut améliorer que ce qu’on mesure. Notons un relevé chaque semaine, et les fuites apparaîtront d’elles-mêmes."], ["npc", "Un relevé par semaine… simple, et on verra enfin où part l’eau. Tiens, prends ce compteur, je m’y mets dès demain !"]],
  en:[["npc", "The well empties faster every summer… but nobody knows how much water the village uses, or when."], ["mem", "In 2024 at Google France I built a measurement dashboard for 180 key accounts. The lesson: you can only improve what you measure. Let’s take one reading a week, and the leaks will show up by themselves."], ["npc", "One reading a week… simple, and we’ll finally see where the water goes. Here, take this meter, I’ll start tomorrow!"]]},
 {id:'bertrand',x:6,y:7,dir:'down',name:'Bertrand',role:L==='fr'?'propriétaire':'landlord',P:{skin:'#E2AE86',hair:'#9A9A9A',top:'#3E7D4E',bot:'#4A3A2A',hat:'#4A3A2A'},item:['📒',L==='fr'?'Registre des loyers':'Rent ledger'],
  fr:[["npc", "Je gère les loyers des douze hameaux autour du village. Chaque hameau tient ses carnets à sa façon : impossible de savoir qui a payé."], ["mem", "En 2025, chez Coface, c’était douze pays avec chacun leurs propres tableaux. On a mis tout le monde sur le même modèle, et le reporting est devenu 30 % plus rapide. Faisons pareil : une ligne par maison, une colonne par mois, partout."], ["npc", "Le même carnet pour les douze hameaux… Je verrai enfin les retards d’un coup d’œil ! Voici le registre des loyers, il est à toi."]],
  en:[["npc", "I manage the rents of the twelve hamlets around the village. Each hamlet keeps its notebooks its own way: impossible to tell who has paid."], ["mem", "In 2025 at Coface it was twelve countries, each with its own reports. We put everyone on the same model and reporting became 30% faster. Let’s do the same: one row per house, one column per month, everywhere."], ["npc", "The same notebook for all twelve hamlets… I’ll finally spot late payments at a glance! Here is the rent ledger, it’s yours."]]},
 {id:'margot',x:25,y:7,dir:'down',name:'Margot',role:L==='fr'?'boulangère':'baker',P:{skin:'#F2C9A5',hair:'#5A3A22',top:'#F6F1E7',bot:'#C2884A',hat:'#FFFFFF',chef:1},item:['🔮',L==='fr'?'Sac de billes':'Bag of marbles'],
  fr:[["npc", "J’ai plus de dix apprentis, et chacun note les dépenses de la boulangerie à sa façon. Farine, bois, réparations… à la fin du mois, je ne sais plus où part l’argent."], ["mem", "Aujourd’hui, comme manager, j’accompagne plus de dix personnes au quotidien, et notre travail touche plus de 1 000 collègues. Le secret : que toute l’équipe range les chiffres de la même façon. Classons tes dépenses par catégorie, ensemble."], ["npc", "Une bille par sou dépensé, rangée par catégorie : les apprentis vont adorer, et moi je verrai tout d’un coup d’œil ! Prends ce sac de billes."]],
