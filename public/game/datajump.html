<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data Jump</title>
<style>
:root{--bg:#F7F7F5;--card:#fff;--ink:#0E1116;--mute:#6B7480;--line:#E3E6E8;--acc:#1AA7B0;--acc2:#3FD3DC;--bad:#E5484D;--bar:#2A2F36}
:root[data-theme="dark"]{--bg:#0E1116;--card:#171B21;--ink:#F3F5F7;--mute:#9AA3AE;--line:#262C34;--acc:#3FD3DC;--acc2:#8EEAF0;--bad:#FF6B70;--bar:#DDE2E8}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1116;--card:#171B21;--ink:#F3F5F7;--mute:#9AA3AE;--line:#262C34;--acc:#3FD3DC;--acc2:#8EEAF0;--bad:#FF6B70;--bar:#DDE2E8}}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.wrap{width:100%;max-width:420px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;color:var(--mute)}
.top b{color:var(--ink);font-size:15px}
.top button{all:unset;cursor:pointer;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12px;color:var(--ink)}
.stage{position:relative;aspect-ratio:5/8;background:var(--card);border:1px solid var(--line);border-radius:20px;overflow:hidden;box-shadow:0 18px 50px rgba(14,17,22,.10);touch-action:none;user-select:none}
canvas{width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;background:color-mix(in srgb,var(--card) 82%,transparent);backdrop-filter:blur(6px)}
.ov h2{font-size:26px;letter-spacing:-.02em;margin-bottom:8px}
.ov p{color:var(--mute);font-size:14px;line-height:1.5;max-width:280px}
.ov .k{font-size:44px;font-weight:800;letter-spacing:-.03em;margin:10px 0 2px}
.ov .k small{display:block;font-size:12px;font-weight:600;color:var(--acc);letter-spacing:.12em;text-transform:uppercase}
.btn{margin-top:18px;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:12px 22px;font-weight:700;font-size:14px;cursor:pointer}
.hint{margin-top:10px;font-size:12px;color:var(--mute)}
.hide{display:none}
.legend{display:flex;gap:14px;justify-content:center;margin-top:10px;font-size:12px;color:var(--mute);flex-wrap:wrap}
.legend i{display:inline-block;width:18px;height:8px;border-radius:3px;vertical-align:middle;margin-right:5px;background:var(--bar)}
.legend i.a{background:var(--acc)}.legend i.b{background:var(--bad)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span data-fr="Record : <b id='best'>0</b>" data-en="Best: <b id='best'>0</b>"></span><span><b id="score">0</b> <span data-fr="lignes nettoyées" data-en="rows cleaned"></span></span><button id="snd" aria-label="sound">🔊</button> <button id="theme" aria-label="theme">◐</button></div>
  <div class="stage">
    <canvas id="c" width="400" height="640"></canvas>
    <div class="ov" id="start">
      <h2>Data Jump</h2>
      <p data-fr="Saute de barre en barre pour nettoyer le jeu de données. Les barres turquoise propulsent, les barres rouges sont des données fausses : elles cassent." data-en="Jump from bar to bar to clean the dataset. Turquoise bars boost you, red bars are bad data: they break."></p>
      <button class="btn" id="play" data-fr="Jouer" data-en="Play"></button>
      <div class="hint" data-fr="← → ou touchez les côtés de l'écran" data-en="← → or tap the sides of the screen"></div>
    </div>
    <div class="ov hide" id="over">
      <div class="k"><small data-fr="Lignes nettoyées" data-en="Rows cleaned"></small><span id="final">0</span></div>
      <p id="msg"></p>
      <button class="btn" id="again" data-fr="Rejouer" data-en="Play again"></button>
    </div>
  </div>
  <div class="legend"><span><i></i><span data-fr="donnée propre" data-en="clean data"></span></span><span><i class="a"></i><span data-fr="bonus" data-en="bonus"></span></span><span><i class="b"></i><span data-fr="donnée fausse" data-en="bad data"></span></span></div>
</div>
<script src="/sfx.js"></script>
<script>
(function(){
var SF=function(n){try{window.KR&&KR.sfx.play(n)}catch(e){}};
var L=(new URLSearchParams(location.search).get('lang')||document.documentElement.lang||'fr').slice(0,2)==='en'?'en':'fr';
document.documentElement.lang=L;
document.querySelectorAll('[data-fr]').forEach(function(e){e.innerHTML=e.getAttribute('data-'+L)});
var root=document.documentElement;
try{var t=localStorage.getItem('kr-theme');if(t)root.setAttribute('data-theme',t)}catch(e){}
var sb=document.getElementById('snd');function ps(){sb.textContent=(window.KR&&KR.sfx.isMuted())?'🔇':'🔊'}sb.onclick=function(){KR.sfx.mute(!KR.sfx.isMuted());ps()};ps();
// theme sync from parent site
window.addEventListener('message',function(e){if(e.data&&e.data.krTheme){root.setAttribute('data-theme',e.data.krTheme)}if(e.data&&e.data.krSound&&window.KR){KR.sfx.mute(e.data.krSound==='off');if(typeof ps==='function')ps()}});try{var pt=parent!==window&&parent.document.documentElement.getAttribute('data-theme');if(pt)root.setAttribute('data-theme',pt)}catch(e){}
document.getElementById('theme').onclick=function(){var cur=root.getAttribute('data-theme')||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');var n=cur==='dark'?'light':'dark';root.setAttribute('data-theme',n);try{localStorage.setItem('kr-theme',n)}catch(e){}};
var cv=document.getElementById('c'),ctx=cv.getContext('2d'),W=400,H=640;
var css=function(v){return getComputedStyle(root).getPropertyValue(v).trim()};
var best=0;try{best=+localStorage.getItem('kr-datajump-best')||0}catch(e){}
document.getElementById('best').textContent=best;
var P,plats,cam,score,running=false,keys={},touchDir=0,raf,t0,shake=0;
var G=0.42,JUMP=-11.6,BOOST=-17.5,SPD=5.2;
function rnd(a,b){return a+Math.random()*(b-a)}
function mkPlat(y){var r=Math.random(),type='n';if(score>200&&r<0.12)type='b';else if(r<0.22)type='a';else if(score>600&&r<0.34)type='m';
 var w=rnd(54,92);return {x:rnd(0,W-w),y:y,w:w,h:14,type:type,vx:type==='m'?(Math.random()<.5?-1.6:1.6):0,broken:false,val:Math.round(rnd(12,98))}}
function reset(){P={x:W/2-16,y:H-120,w:32,h:32,vy:0,vx:0,face:1};plats=[];cam=0;score=0;shake=0;
 plats.push({x:W/2-50,y:H-60,w:100,h:14,type:'n',vx:0,broken:false,val:50});
 for(var y=H-130;y>-H;y-=rnd(58,84))plats.push(mkPlat(y));}
function startGame(){reset();running=true;document.getElementById('start').classList.add('hide');document.getElementById('over').classList.add('hide');t0=performance.now();loop()}
function endGame(){running=false;cancelAnimationFrame(raf);var s=Math.round(score);document.getElementById('final').textContent=s.toLocaleString(L==='fr'?'fr-FR':'en-US');
 var m;if(s>best){best=s;try{localStorage.setItem('kr-datajump-best',best)}catch(e){}document.getElementById('best').textContent=best;SF('record');m=L==='fr'?'Nouveau record ! Le jeu de données n’a jamais été aussi propre.':'New record! The dataset has never been this clean.'}
 else{SF('over');m=L==='fr'?'Record à battre : '+best+' lignes. Une donnée fausse a eu raison de vous.':'Best to beat: '+best+' rows. Bad data got the better of you.'}
 document.getElementById('msg').textContent=m;document.getElementById('over').classList.remove('hide')}
function step(){
 var dir=(keys.ArrowLeft||keys.a||keys.q?-1:0)+(keys.ArrowRight||keys.d?1:0)+touchDir;
 P.vx=dir*SPD;if(dir)P.face=dir;P.x+=P.vx;if(P.x<-P.w)P.x=W;if(P.x>W)P.x=-P.w;
 P.vy+=G;P.y+=P.vy;
 if(P.vy>0){for(var i=0;i<plats.length;i++){var p=plats[i];if(p.broken)continue;
  if(P.x+P.w-6>p.x&&P.x+6<p.x+p.w&&P.y+P.h>=p.y&&P.y+P.h<=p.y+p.h+P.vy){
   if(p.type==='b'){p.broken=true;shake=6;SF('break');continue}
   P.y=p.y-P.h;P.vy=p.type==='a'?BOOST:JUMP;if(p.type==='a'){score+=25;SF('bonus')}else SF('jump');break}}}
 for(var j=0;j<plats.length;j++){var q=plats[j];if(q.vx){q.x+=q.vx;if(q.x<0||q.x+q.w>W)q.vx*=-1}}
 if(P.y<H*0.42){var d=H*0.42-P.y;P.y=H*0.42;score+=d/8;for(var k=0;k<plats.length;k++)plats[k].y+=d;
  plats=plats.filter(function(p){return p.y<H+40});var top=Math.min.apply(null,plats.map(function(p){return p.y}));
  while(top>-80){var ny=top-rnd(58,84+Math.min(score/40,40));plats.push(mkPlat(ny));top=ny}}
 if(P.y>H+40)endGame();
 document.getElementById('score').textContent=Math.round(score).toLocaleString(L==='fr'?'fr-FR':'en-US');
}
function draw(){
 var bg=css('--card'),ink=css('--ink'),bar=css('--bar'),acc=css('--acc'),bad=css('--bad'),line=css('--line'),mute=css('--mute');
 ctx.save();if(shake>0){ctx.translate(rnd(-shake,shake),rnd(-shake,shake));shake-=.6}
 ctx.fillStyle=bg;ctx.fillRect(-10,-10,W+20,H+20);
 ctx.strokeStyle=line;ctx.lineWidth=1;var off=(cam%40);for(var y=((score*8)%40);y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 ctx.fillStyle=mute;ctx.font='11px Inter,system-ui,sans-serif';
 plats.forEach(function(p){if(p.broken)return;ctx.fillStyle=p.type==='a'?acc:p.type==='b'?bad:bar;rr(p.x,p.y,p.w,p.h,5);ctx.fill();
  if(p.type==='b'){ctx.strokeStyle=bg;ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(p.x+p.w/2-5,p.y+3);ctx.lineTo(p.x+p.w/2+5,p.y+11);ctx.moveTo(p.x+p.w/2+5,p.y+3);ctx.lineTo(p.x+p.w/2-5,p.y+11);ctx.stroke()}
  ctx.fillStyle=mute;ctx.fillText(p.val,p.x,p.y-4)});
 ctx.fillStyle=ink;rr(P.x,P.y,P.w,P.h,9);ctx.fill();
 ctx.fillStyle=acc;ctx.beginPath();ctx.arc(P.x+P.w/2+P.face*6,P.y+13,4,0,7);ctx.fill();
 ctx.fillStyle=bg;ctx.font='bold 10px Inter,system-ui,sans-serif';ctx.fillText('KR',P.x+8,P.y+27);
 ctx.restore()}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function loop(){if(!running)return;step();draw();raf=requestAnimationFrame(loop)}
addEventListener('keydown',function(e){keys[e.key]=true;if(['ArrowLeft','ArrowRight',' '].indexOf(e.key)>=0)e.preventDefault();if(!running&&(e.key===' '||e.key==='Enter'))startGame()});
addEventListener('keyup',function(e){keys[e.key]=false});
var st=document.querySelector('.stage');
function tpos(e){var r=st.getBoundingClientRect();var x=(e.touches?e.touches[0].clientX:e.clientX)-r.left;touchDir=x<r.width/2?-1:1}
st.addEventListener('touchstart',function(e){if(e.target.tagName==='BUTTON')return;tpos(e);e.preventDefault()},{passive:false});
st.addEventListener('touchmove',function(e){tpos(e);e.preventDefault()},{passive:false});
st.addEventListener('touchend',function(){touchDir=0});
st.addEventListener('mousedown',function(e){if(e.target.tagName==='BUTTON')return;tpos(e)});
addEventListener('mouseup',function(){touchDir=0});
var touching=false;st.addEventListener('touchstart',function(){touching=true});st.addEventListener('touchend',function(){touching=false});
if(window.DeviceOrientationEvent)addEventListener('deviceorientation',function(e){if(e.gamma==null||touching)return;var g=e.gamma;touchDir=Math.abs(g)<5?0:Math.max(-1,Math.min(1,g/18))});
document.getElementById('play').onclick=startGame;document.getElementById('again').onclick=startGame;
reset();draw();
})();
</script>
</body>
</html>
