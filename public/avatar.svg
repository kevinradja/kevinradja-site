<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Avatar de Kevin Radja">
  <defs><filter id="px" filterUnits="userSpaceOnUse" primitiveUnits="userSpaceOnUse" x="0" y="0" width="400" height="400"><feFlood x="2" y="2" width="1" height="1"/><feComposite width="4" height="4"/><feTile result="t"/><feComposite in="SourceGraphic" in2="t" operator="in"/><feMorphology operator="dilate" radius="2"/></filter>
    <clipPath id="c"><circle cx="200" cy="200" r="200"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0E5257"/><stop offset="1" stop-color="#0A3A3E"/></linearGradient>
  </defs><g filter="url(#px)">
  <g clip-path="url(#c)">
    <rect width="400" height="400" fill="url(#bg)"/>
    <!-- soft data lines in the background -->
    <g stroke="#9FE0D8" stroke-opacity=".14" stroke-width="2" fill="none">
      <polyline points="0,120 60,110 120,128 180,96 240,104 300,70 360,80 400,60"/>
      <polyline points="0,170 70,160 140,176 210,150 280,158 350,130 400,138"/>
    </g>
    <circle cx="330" cy="72" r="5" fill="#9FE0D8" fill-opacity=".5"/>
    <circle cx="300" cy="70" r="3" fill="#9FE0D8" fill-opacity=".35"/>

    <!-- hair behind (shoulder-length curls) -->
    <g fill="#1B1411">
      <ellipse cx="200" cy="168" rx="92" ry="96"/>
      <circle cx="122" cy="200" r="30"/><circle cx="114" cy="236" r="26"/><circle cx="126" cy="266" r="22"/>
      <circle cx="278" cy="200" r="30"/><circle cx="286" cy="236" r="26"/><circle cx="274" cy="266" r="22"/>
      <circle cx="140" cy="128" r="30"/><circle cx="260" cy="128" r="30"/>
    </g>

    <!-- coat and tee -->
    <path d="M40 400 C52 318 108 292 200 292 C292 292 348 318 360 400 Z" fill="#14181C"/>
    <path d="M150 296 L200 400 L250 296 Z" fill="#0B0D10"/>
    <path d="M150 296 L176 400 L120 400 L118 330 Z" fill="#1E2328"/>
    <path d="M250 296 L224 400 L280 400 L282 330 Z" fill="#1E2328"/>
    <!-- neck -->
    <path d="M176 238 L176 300 Q200 318 224 300 L224 238 Z" fill="#5E3A28"/>

    <!-- face -->
    <ellipse cx="200" cy="196" rx="54" ry="66" fill="#6E4430"/>
    <ellipse cx="146" cy="200" rx="9" ry="14" fill="#6E4430"/>
    <ellipse cx="254" cy="200" rx="9" ry="14" fill="#6E4430"/>
    <!-- brows, eyes -->
    <path d="M168 178 Q180 172 192 178" stroke="#140F0D" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M208 178 Q220 172 232 178" stroke="#140F0D" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M173 194 Q180 186 187 194" stroke="#140F0D" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <path d="M213 194 Q220 186 227 194" stroke="#140F0D" stroke-width="4.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="166" cy="214" rx="9" ry="5" fill="#8A5440" opacity=".55"/>
    <ellipse cx="234" cy="214" rx="9" ry="5" fill="#8A5440" opacity=".55"/>
    <!-- nose -->
    <path d="M200 196 Q196 214 188 220 Q200 226 212 220" stroke="#4E2F20" stroke-width="3.5" fill="none" stroke-linecap="round"/>
    <!-- moustache, mouth, goatee -->
    <path d="M180 230 Q200 222 220 230" stroke="#1B1411" stroke-width="5" fill="none" stroke-linecap="round"/>
    <path d="M180 236 Q200 258 220 236 Q200 244 180 236 Z" fill="#F4EFE4" stroke="#3A2218" stroke-width="2.5" stroke-linejoin="round"/>
    <path d="M190 254 Q200 270 210 254 Q206 262 200 262 Q194 262 190 254 Z" fill="#1B1411"/>

    <!-- hair front fringe -->
    <g fill="#1B1411">
      <circle cx="160" cy="138" r="18"/><circle cx="184" cy="130" r="18"/><circle cx="210" cy="128" r="18"/><circle cx="236" cy="136" r="18"/>
      <circle cx="146" cy="156" r="14"/><circle cx="254" cy="156" r="14"/>
    </g>
    <!-- black headband / cap with sunglasses on top -->
    <path d="M136 132 Q200 92 264 132 L262 146 Q200 112 138 146 Z" fill="#0B0D10"/>
    <g fill="#0B0D10" stroke="#2A3036" stroke-width="2">
      <rect x="150" y="98" width="42" height="22" rx="10"/>
      <rect x="208" y="98" width="42" height="22" rx="10"/>
    </g>
    <path d="M192 108 L208 108" stroke="#2A3036" stroke-width="4"/>
    <path d="M160 104 L172 104" stroke="#9FE0D8" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
    <path d="M218 104 L230 104" stroke="#9FE0D8" stroke-opacity=".5" stroke-width="3" stroke-linecap="round"/>
  </g>
</g></svg>
